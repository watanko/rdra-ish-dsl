name: Portability

# Runs the same test step as release.yml on every release OS, with plain stable
# Rust and no nix or TLC, so a tag does not meet a red build for the first time.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: portability-${{ matrix.os }}

      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Test
        env:
          RDRA_TEST_PYTHON: python
        run: uv run --isolated --no-project --python 3.13 --with pydantic==2.13.4 --with sqlalchemy==2.0.49 cargo test --workspace --locked
